name: Java CI with Gradle

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Start SUT (System Under Test)
        run: |
          java -jar artifacts/app-replan-delivery.jar &
          sleep 20
          curl -sf http://localhost:9999 > /dev/null && echo "SUT is UP" || echo "SUT might be down"

      - name: Run tests via xvfb
        run: xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' ./gradlew test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/